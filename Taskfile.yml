version: '3'

# Single entrypoint for local verification, ateam_task MCP tool, and CI.

tasks:
  default:
    desc: List all available tasks
    cmds:
      - task --list

  review:route:
    desc: Validate and display configured developer/reviewer model routing
    cmds:
      - "go run ./cmd/ateam review route {{.CLI_ARGS}}"

  review:check:
    desc: Validate current PR review evidence against trusted base policy
    cmds:
      - "go run ./cmd/ateam review check {{.CLI_ARGS}}"

  merge:check:
    desc: Check active main ruleset, PR review and reviewer strength, and open class:flake issues
    cmds:
      - go build -o .ateam/bin/ateam ./cmd/ateam
      - "ATEAM=.ateam/bin/ateam scripts/merge-check.sh {{.CLI_ARGS}}"

  doctor:
    desc: Check tool versions, OpenSpec state, and multi-agent parity
    cmds:
      - go run ./cmd/ateam doctor

  fmt:
    desc: Format Go sources
    cmds:
      - gofmt -w ./cmd ./internal

  fmt:check:
    desc: Fail if any Go source needs formatting (no writes)
    cmds:
      - |
        drift=$(gofmt -l ./cmd ./internal)
        if [ -n "$drift" ]; then echo "gofmt drift:"; echo "$drift"; exit 1; fi

  spec:check:
    desc: "Validate OpenSpec changes/specs and fail on a Hold: written outside every task"
    cmds:
      - PATH="{{.ROOT_DIR}}/node_modules/.bin:$PATH" go run ./cmd/ateam state spec-check

  spec:queue:
    desc: Show each in-flight OpenSpec change with its holds and blocking conditions
    cmds:
      - go run ./cmd/ateam state spec-queue

  tidy:check:
    desc: Fail if go.mod or go.sum is not tidy
    cmds:
      - go mod tidy -diff

  vet:
    desc: Run go vet
    cmds:
      - go vet ./...

  lint:
    desc: Run revive with revive.toml
    cmds:
      - |
        if command -v revive >/dev/null 2>&1; then
          revive -config revive.toml -formatter friendly -set_exit_status ./...
        else
          go run github.com/mgechev/revive@v1.15.0 -config revive.toml -formatter friendly -set_exit_status ./...
        fi

  test:spec:
    desc: Check deterministic Go and Vitest test-to-spec attribution
    cmds:
      - go run ./cmd/ateam test-spec
      - npm --prefix ui run test:unit -- scripts/testspec.test.js

  test:unit:
    desc: Run Go unit and agent-parity tests with race detector
    cmds:
      - go test -race -count=1 ./...

  bench:selftest:
    desc: Run offline benchmark self-tests and mutation checks (0 API calls)
    cmds:
      - go run ./cmd/ateam bench --selftest

  bench:report-check:
    desc: Check redistributable report worked examples offline (0 API calls)
    cmds:
      - go test ./internal/bench -run '^TestReportWorkedExamples$' -count=1

  mutate:check:
    desc: "Run non-destructive Go -overlay mutation check (-- -pkg -test -file -mutant -expect or -expect-text)"
    cmds:
      - "go run ./cmd/ateam mutate {{.CLI_ARGS}}"

  ui:install:
    desc: Install UI dependencies in ui/
    dir: ui
    cmds:
      - npm install

  ui:check:
    desc: Run svelte-kit sync and svelte-check
    dir: ui
    cmds:
      - npm run check

  ui:test:
    desc: Run UI unit tests with vitest
    dir: ui
    cmds:
      - npm run test:unit

  ui:build:
    desc: Build static SvelteKit UI and sync into internal/web/dist
    cmds:
      - cd ui && npm run build
      - rm -rf internal/web/dist && mkdir -p internal/web/dist
      - touch internal/web/dist/.keep
      - cp -R ui/build/. internal/web/dist/

  build:
    desc: Build static UI and single ./bin/ateam binary
    cmds:
      - task: ui:build
      - mkdir -p bin
      # Go's own VCS stamping reads the parent checkout from a linked worktree, so stamp both here (#193).
      - go build -ldflags "-X github.com/c360studio/ateam/internal/state.BuildCommit=$(git rev-parse HEAD) -X github.com/c360studio/ateam/internal/state.Version=$(git describe --tags --always --dirty 2>/dev/null)" -o bin/ateam ./cmd/ateam

  serve:
    desc: Start ateam PM board and API server
    cmds:
      - go run ./cmd/ateam serve

  verify:
    desc: Run all 4 Definition of Done gates on a clean tree
    cmds:
      - task: fmt:check
      - task: spec:check
      - task: test:spec
      - task: tidy:check
      - task: vet
      - task: lint
      - task: test:unit
      - task: bench:selftest
      - task: ui:check
      - task: ui:test
      - task: ui:build
      - |
        dirty=$(git status --porcelain)
        if [ -n "$dirty" ]; then
          echo "verify check: tracked/untracked drift after verify:"
          echo "$dirty"
          exit 1
        fi
