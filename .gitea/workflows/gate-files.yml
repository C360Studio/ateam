name: Gate files

# pull_request, not pull_request_target (#360), as in the GitHub twin
# .github/workflows/gate-files.yml (#143). So this
# workflow and the script it calls come from the pull request's own tree, and a
# pull request that edits either is judged by its edited copy: review of such a
# pull request is the control. It stays fail-closed on the name: branch
# protection requires Gate files / Gate files (pull_request), so one that deletes the
# workflow or renames the job reports no such check and stays blocked (#140);
# a skipped job under that name counts as passing, so it is review's to catch. The pull request's state is read through the API only.
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, labeled, unlabeled, edited]

concurrency:
  group: gate-files-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

jobs:
  gate-files:
    # Skipped and renamed on a WIP pull request, so a rerun of a WIP run never
    # posts a skipped Gate files status; a label change still runs it under its
    # required name: Gitea reports adding and removing a label as label_updated
    # (label_cleared for all), so revoking gate-change-approved fails it (#257).
    name: ${{ github.event.pull_request.draft && github.event.action != 'label_updated' && github.event.action != 'label_cleared' && 'Gate files (draft, skipped)' || 'Gate files' }}
    if: ${{ !github.event.pull_request.draft || github.event.action == 'label_updated' || github.event.action == 'label_cleared' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Fail a gate-file change without the owner label
        env:
          ATEAM_FORGE: gitea
          GITEA_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: scripts/gate-files.sh "$PR_NUMBER"
