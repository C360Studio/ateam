name: Merge check

# Its own workflow and required check, apart from CI (#255): the merge check
# reads PR state (the review record, the reviewed-by: line, open flake issues),
# so it reruns on edited, which is how the reviewer's description edit reaches
# it, without rerunning Verify. pull_request, not pull_request_target, so the
# pull request that adds or changes this file runs it; a change here is a gate
# file and fails Gate files without the owner label.
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, edited]

# One run per pull request at a time, queued, never cancelled: a cancelled
# Merge check would sit beside the passing one at the same head (#87), and the
# queued latest event reads the forge after every earlier run finished.
concurrency:
  group: merge-check-${{ github.event.pull_request.number }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  # Up-to-date rule, review check and known-flake check (scripts/merge-check.sh).
  # Skipped and renamed on a WIP pull request (Gitea sets draft from the WIP:
  # prefix), so a rerun of a WIP run never posts a skipped Merge check, which
  # Gitea counts as passing; leaving WIP: is an edited event (#257).
  # Also skipped and renamed until the description contains reviewed-by: (#262):
  # before the review record the pull request is not yet judgeable, so the
  # required context stays absent instead of failing. contains() is looser than
  # the gate's line rule, so a loose match only runs the full check below; it
  # reads the event payload, so a rerun replays the description it saw.
  merge-check:
    name: ${{ github.event.pull_request.draft && 'Merge check (draft, skipped)' || !contains(github.event.pull_request.body, 'reviewed-by:') && 'Merge check (awaiting review record, skipped)' || 'Merge check' }}
    if: ${{ !github.event.pull_request.draft && contains(github.event.pull_request.body, 'reviewed-by:') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      issues: read
      pull-requests: read
    steps:
      # The base commit, not the pull request: the script, the review policy it
      # reads, and the ateam binary built below must not come from the tree they
      # judge, or a pull request could loosen its own gate (#140). The pull
      # request itself is read through the API.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      # merge-check.sh calls ateam review compare once .agents/review-policy.json exists.
      - run: go build -o "$RUNNER_TEMP/ateam" ./cmd/ateam

      - name: Check the up-to-date rule, the review and its strength, and known flakes
        env:
          ATEAM: ${{ runner.temp }}/ateam
          # Every context main's branch protection must require, so dropping one
          # fails here.
          ATEAM_REQUIRED_CHECKS: CI / Required (pull_request),Merge check / Merge check (pull_request)
          # Gitea: the job token only, no extra secret. It cannot read the branch
          # protection rule, so the up-to-date setting prints strict=unverified.
          GITEA_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: scripts/merge-check.sh "$PR_NUMBER"
