name: CI

on:
  push:
    branches: [main]
  # Every PR gets CI whatever its base, so stacked PRs are covered too. Listing
  # types replaces GitHub's default three, so they are listed with
  # ready_for_review: a draft skips every job, so marking it ready starts the
  # first run that checks it.
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, edited]

# Superseded PR runs are cancelled, except the run that marking a draft ready
# starts: it reuses the head SHA, and cancelling the run already in flight would
# leave a failed Required on a head that was never broken (#87). Pushes to main
# are never cancelled, so two quick merges never leave one on a commit either.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' && github.event.action != 'ready_for_review' }}

permissions:
  contents: read

# Every job is pinned to ubuntu-24.04 by the merge-gate spec.
jobs:
  verify:
    name: ${{ github.event.pull_request.draft && 'Verify (draft, skipped)' || 'Verify' }}
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            ui/package-lock.json

      # The root packages carry the OpenSpec CLI; without them spec:check skips strict validation (#127).
      - run: npm ci

      - run: npm --prefix ui ci

      - uses: go-task/setup-task@a00fbb05ce67b35648be3c78cbc9fd85354c757e # v2.2.0
        with:
          version: 3.43.3

      - run: task build

      - run: ./bin/ateam doctor --check

      - run: task verify

  # Single required status check: anything other than success in a needed job
  # (failure, cancelled, skipped, or a job that never ran) fails the aggregate.
  # The merge check is its own workflow and required check (merge-check.yml,
  # #255), so an open flake issue or a missing review never fails Required.
  # On a WIP pull request every job is skipped and renamed (Gitea sets draft from
  # the WIP: prefix). Gitea counts a skipped status as passing, and a WIP run
  # rerun after the PR is ready skips again from its saved event, so a skipped
  # job must never post under a required name. Leaving WIP: is an edited event.
  # Needs Gitea 28.x: older Gitea evaluates neither name: nor a compound
  # always() (#257).
  required:
    name: ${{ github.event.pull_request.draft && 'Required (draft, skipped)' || 'Required' }}
    needs: [verify]
    if: always() && (github.event_name != 'pull_request' || !github.event.pull_request.draft)
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require every needed job to succeed
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "needed job results: ${RESULTS:-<none>}"
          if [ -z "$RESULTS" ]; then echo "no needed jobs reported"; exit 1; fi
          for r in $RESULTS; do
            if [ "$r" != "success" ]; then echo "required check did not succeed: $r"; exit 1; fi
          done
