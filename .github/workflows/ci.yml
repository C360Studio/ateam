name: CI

on:
  push:
    branches: [main]
  # Every PR gets CI whatever its base, so stacked PRs are covered too. Listing
  # types replaces GitHub's default three, so they are listed with
  # ready_for_review: marking a draft ready starts the run that applies the
  # review check, which does not fail a draft.
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

# Superseded PR runs are cancelled, except the run that marking a draft ready
# starts: it reuses the head SHA, and cancelling the run already in flight would
# leave a failed Required on a head that was never broken (#87). Pushes to main
# are never cancelled, so two quick merges never leave one on a commit either.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' && github.event.action != 'ready_for_review' }}

permissions:
  contents: read

# Every job is pinned to ubuntu-24.04 by the merge-gate spec.
jobs:
  verify:
    name: ${{ github.event.pull_request.draft && 'Verify (draft, skipped)' || 'Verify' }}
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - run: sleep 60

  # Single required status check: anything other than success in a needed job
  # (failure, cancelled, skipped, or a job that never ran) fails the aggregate.
  required:
    name: ${{ github.event.pull_request.draft && 'Required (draft, skipped)' || 'Required' }}
    needs: [verify]
    if: always() && (github.event_name != 'pull_request' || !github.event.pull_request.draft)
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require every needed job to succeed
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "needed job results: ${RESULTS:-<none>}"
          if [ -z "$RESULTS" ]; then echo "no needed jobs reported"; exit 1; fi
          for r in $RESULTS; do
            if [ "$r" != "success" ]; then echo "required check did not succeed: $r"; exit 1; fi
          done
