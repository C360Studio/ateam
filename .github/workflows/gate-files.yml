name: Gate files

# pull_request, not pull_request_target (#360): GitHub's default event policy
# blocks pull_request_target in public repositories from 2026-12-02. So this
# workflow and the script it calls come from the pull request's own tree, and a
# pull request that edits either is judged by its edited copy: review of such a
# pull request is the control. It stays fail-closed on the name: the main
# ruleset requires a check named Gate files, so a pull request that deletes the
# workflow, renames the job, or makes it skip reports no such check and stays
# blocked (#140). The pull request's state is read through the API only.
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, labeled, unlabeled]

concurrency:
  group: gate-files-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

jobs:
  gate-files:
    # Skipped and renamed on a draft, so a draft head carries no Gate files check
    # run for GitHub to count as passing (#250). Removing a label still runs it
    # on a draft, so revoking gate-change-approved replaces an earlier pass at
    # the same head before the PR can be marked ready again.
    name: ${{ github.event.pull_request.draft && github.event.action != 'unlabeled' && 'Gate files (draft, skipped)' || 'Gate files' }}
    if: ${{ !github.event.pull_request.draft || github.event.action == 'unlabeled' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Fail a gate-file change without the owner label
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: scripts/gate-files.sh "$PR_NUMBER"
