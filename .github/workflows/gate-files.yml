name: Gate files

# pull_request_target runs this workflow and the script it calls from the base
# branch, never from the pull request, so a pull request cannot loosen the check
# that judges it (#140). It must never check out or run pull request code: the
# checkout below is the base branch, and the pull request's files are read
# through the API only.
on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review, labeled, unlabeled]

concurrency:
  group: gate-files-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

jobs:
  gate-files:
    # Skipped and renamed on a draft, so a draft head carries no Gate files check
    # run for GitHub to count as passing (#250).
    name: ${{ github.event.pull_request.draft && 'Gate files (draft, skipped)' || 'Gate files' }}
    if: ${{ !github.event.pull_request.draft }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Fail a gate-file change without the owner label
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: scripts/gate-files.sh "$PR_NUMBER"
