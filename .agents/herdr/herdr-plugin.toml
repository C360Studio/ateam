id = "ateam"
name = "ateam"
version = "0.1.0"
min_herdr_version = "0.9.5"

[[panes]]
id = "pickup"
title = "ateam pickup"
placement = "popup"
command = ["sh", "-c", "ateam state pickup; printf '\\n[enter to close]'; read _"]

[[panes]]
id = "spec-queue"
title = "ateam spec queue"
placement = "popup"
command = ["sh", "-c", "ateam state spec-queue; printf '\\n[enter to close]'; read _"]

[[actions]]
id = "pickup"
title = "ateam: pickup"
contexts = ["workspace"]
command = ["ateam", "state", "herdr", "open-pane", "pickup"]

[[actions]]
id = "spec-queue"
title = "ateam: spec queue"
contexts = ["workspace"]
command = ["ateam", "state", "herdr", "open-pane", "spec-queue"]

[[events]]
on = "worktree.created"
command = ["ateam", "state", "herdr", "on-event"]

[[events]]
on = "pane.agent_status_changed"
command = ["ateam", "state", "herdr", "on-event"]
