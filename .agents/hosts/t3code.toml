# T3 Code host manifest for ateam review request and notify (#300). A gate file:
# a change here changes what review_launch: agent does, so it needs the owner's
# gate-change-approved label.
#
# T3 Code's t3 CLI starts a thread with `t3 thread start <project> <message>
# --provider <instance id> --model <slug>` and queues a message into a thread
# with `t3 thread send <thread> <message>` (cli/thread.ts @ 6577c6b6). Launch is
# tool text, not a command: T3's provider instance ids are not ateam's agent
# names (claude is claudeAgent, codex is codex, and there is no gemini driver),
# the CLI takes no effort flag, and <project> must resolve inside the project's
# root, which a T3 worktree outside the repository does not. Not run live.

[launch]
tool = "run t3 thread start <the main checkout's path, or the T3 project id from t3 thread list> '{prompt} at {sha}; when your record is posted, run ateam review notify --record <record file> --return-to {return_to} {pr}' --provider <T3 instance id for {agent}: claudeAgent for claude, codex for codex; no T3 driver for gemini> --model {model}; T3 takes no effort flag, so set effort {effort} in the thread"

# The fixed message is appended as the last argument, never substituted.
[notify]
command = ["t3", "thread", "send", "{return_to}"]
